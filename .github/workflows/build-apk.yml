name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure permissions and cleartext traffic in AndroidManifest.xml
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest_path.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<manifest ",
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android" ',
                  1
              )
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n    <application',
                  1
              )
          elif "android.permission.RECORD_AUDIO" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n    <application',
                  1
              )

          if 'android:usesCleartextTraffic=' not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest_path.write_text(content, encoding="utf-8")
          PYEOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistente-android-ia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
